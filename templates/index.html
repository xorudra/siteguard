<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SiteGuard — Is your website safe?</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:640px;margin:0 auto;padding:24px 16px;color:#222}
  h1{font-size:1.6em} p.lead{color:#555}
  form{display:flex;gap:8px;margin:20px 0}
  input{flex:1;padding:12px;font-size:1em;border:2px solid #ccc;border-radius:8px}
  button{padding:12px 20px;font-size:1em;background:#1a73e8;color:#fff;border:0;border-radius:8px}
  .err{background:#fee;color:#a00;padding:12px;border-radius:8px}
  .fine{color:#777;font-size:.9em}
</style>
</head>
<body>
  <h1>🛡️ SiteGuard</h1>
  <p class="lead">Type your website address. We'll check it for common security problems and explain everything in simple words — no tech knowledge needed.</p>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <form action="/scan" method="post">
    <input name="url" placeholder="example.com" autocomplete="off">
    <button type="submit">Scan</button>
  </form>
  <p class="fine">Takes about 30 seconds. We only check publicly visible things — the same things an attacker would see.</p>
</body>
</html>
