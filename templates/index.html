<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SiteGuard — Is your website safe?</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f2027,#203a43 55%,#2c5364);color:#fff;padding:24px 16px}
  .card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:40px 36px;max-width:560px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
  .logo{width:64px;height:64px;margin:0 auto 12px;display:block}
  h1{margin:0 0 8px;font-size:2em;letter-spacing:.5px}
  .tag{color:#c9d6df;margin:0 0 26px;font-size:1.02em;line-height:1.55}
  form{display:flex;gap:10px}
  input{flex:1;min-width:0;padding:14px 16px;font-size:1em;border:2px solid rgba(255,255,255,.2);border-radius:12px;background:rgba(255,255,255,.08);color:#fff;outline:none}
  input::placeholder{color:#9fb3c0}
  input:focus{border-color:#2f81f7}
  button{padding:14px 28px;font-size:1em;font-weight:600;background:#2f81f7;color:#fff;border:0;border-radius:12px;cursor:pointer;white-space:nowrap}
  button:hover{background:#1f6feb}
  button:disabled{opacity:.65;cursor:default}
  .err{background:rgba(248,81,73,.14);border:1px solid rgba(248,81,73,.5);color:#ffb4ae;padding:12px 16px;border-radius:12px;margin:0 0 18px;text-align:left;line-height:1.45}
  .fine{color:#9fb3c0;font-size:.88em;margin:20px 0 0;line-height:1.55}
  .spin{display:none;margin-top:20px;color:#c9d6df;font-size:.95em}
  .spin .bar{height:6px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;margin-bottom:10px}
  .spin .bar i{display:block;height:100%;width:40%;border-radius:4px;background:#2f81f7;animation:slide 1.2s infinite ease-in-out}
  @keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}
  @media(max-width:520px){form{flex-direction:column}.card{padding:32px 22px}}
</style>
</head>
<body>
  <div class="card">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="#4da3ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 2l8 3v6c0 5-3.4 8.6-8 11-4.6-2.4-8-6-8-11V5l8-3z"/>
      <path d="M9 12l2 2 4-4"/>
    </svg>
    <h1>SiteGuard</h1>
    <p class="tag">Type your website address. We&rsquo;ll check it for common security problems and explain everything in simple words.</p>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <form action="/scan" method="post" id="scanForm">
      <input name="url" placeholder="example.com" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button type="submit" id="scanBtn">Scan</button>
    </form>
    <div class="spin" id="spin"><div class="bar"><i></i></div>Scanning&hellip; this takes about 30 seconds.</div>
    <p class="fine">We only check publicly visible things &mdash; the same things an attacker would see.</p>
  </div>
<script>
document.getElementById('scanForm').addEventListener('submit', function () {
  var b = document.getElementById('scanBtn');
  b.disabled = true;
  b.textContent = 'Scanning…';
  document.getElementById('spin').style.display = 'block';
});
</script>
</body>
</html>
